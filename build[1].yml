name: Build Lineup Card

on:
  schedule:
    - cron: "0 13 * * *"   # 9:00 AM ET (in EDT)
    - cron: "0 16 * * *"   # 12:00 PM ET — catches early lineups
    - cron: "0 20 * * *"   # 4:00 PM ET — most lineups posted
    - cron: "0 22 * * *"   # 6:00 PM ET — night game lineups
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build site
        run: node build.js
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Save today's calls
        run: |
          if [ -d data ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/
            if git diff --staged --quiet; then
              echo "No call changes to commit."
            else
              git commit -m "Save calls data [skip ci]"
              git pull --rebase origin ${{ github.ref_name }}
              git push
            fi
          else
            echo "No data directory yet."
          fi
